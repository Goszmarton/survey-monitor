name: daily-monitor

on:
  schedule:
    # BACKUP-slot (2026-08-28). Az ELSŐDLEGES napi indító a SZERVER: curl → workflow_dispatch
    # 16:30 Europe/Budapest-kor (systemd-timer, DST-biztos, pontos — nem függ a scheduled-cron
    # sorállásától; ld. scripts/gh-trigger.sh + docs/UZEMELTETES.md). Ez a cron csak BACKUP arra
    # az esetre, ha a szerver-trigger nem lő (kiesés/hálózat/PAT). A dupla indítást (ha mindkettő
    # fut) a run.js idempotencia-őre dedupolja (hasCompletedRun) → pontosan egy levél megy ki.
    #
    # 16:00 UTC: a szerver-trigger MÖGÉ tolva, év közben végig utána — nyáron 18:00 CEST
    # (~1,5h a szerver-trigger után), TÉLEN 17:00 CET (~0,5h után). DST-figyelmeztetés: egy fix
    # UTC-cron nem tud egész évben azonos helyit (a szerver-timer viszont DST-biztos helyi idő).
    # A korábbi 14:33 UTC (esti, 2026-08-26) és a 08:43 UTC (15:00-s SLA) ELÉVÜLT — ld. git-történet.
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Őr átlépése (kézi 'küldj most' — akkor is fusson, ha ma már volt sikeres futás)"
        type: boolean
        default: false

permissions:
  contents: write   # állapot-DB visszacommit (F1-től)
  pages: write      # Pages deploy
  id-token: write   # Pages deploy

concurrency:
  group: daily-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24   # beépített node:sqlite flag nélkül, warning nélkül
          cache: npm

      - run: npm ci

      # (a) test-gate: a config-blocklist guard (config_llm.test.js — deprecated groq-modell
      # tiltása) csak akkor VÉD élesben, ha a CI a napi futás ELŐTT lefuttatja. Enélkül egy
      # leállt modell (mint a 08-16-i llama-deprecation) semmit sem bukna deploy előtt. Bukó
      # teszt itt megállítja a jobot, MIELŐTT hibás konfiggal levelet küldene.
      - name: Test-gate (config-blocklist + regresszió)
        run: npm test

      - name: Napi futás (jelentés + email)
        # A LÉPÉS saját timeoutja kisebb a job-énál (30) — így egy beragadt fetch a LÉPÉST
        # buktatja (failure()), tartalékkal a hiba-email lefutására, a job-szintű cancel
        # ELŐTT. (2026-08-24: egy időtlen body-stream 30 percig némán függött, a job-cancel
        # skippelt MINDENT, a failure()-höz kötött hiba-email is elmaradt.) Az egy-hívásos
        # body-timeout már a http.js-ben ül; ez a step-timeout a második védővonal.
        timeout-minutes: 25
        env:
          # FORCE_RUN=1 átlépi az idempotencia-őrt (run.js): kézi dispatch force=true esetén a
          # futás akkor is lefut, ha ma már volt sikeres. Scheduled/backup futásnál az input
          # nincs → üres → az őr él (dedup). A '' → nem "1", tehát az őr NEM lép át.
          FORCE_RUN: ${{ github.event.inputs.force == 'true' && '1' || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: node src/run.js

      - name: Állapot-DB + archív visszacommit (main)
        run: |
          git config user.name "monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          # F4-B: az archive/ a dátumozott jelentések PERZISZTENS forrása (a dist/ gitignore-olt
          # build-kimenet). Visszacommitoljuk, hogy a következő futás buildDist-je a TELJES
          # archívot dist/-be rakhassa → a korábbi napok archív URL-jei nem 404-elnek.
          git add state/monitor.db archive/
          if git diff --cached --quiet; then
            echo "Nincs állapotváltozás — nincs mit commitolni."
          else
            git commit -m "state: napi futás $(date -u +%F)"
            git push
          fi

      - name: Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # F4-C: a deploy-pages 2026-08-06-on egy TRANZIENS Pages-backend beragadásba futott
      # (10 perc self-timeout, nem concurrency). F4-B óta a napi archív ÉRTÉKES (egy bukott
      # deploy egy napot késleltetne), ezért egy natív 1-retry (nincs marketplace-függés):
      # az első kísérlet continue-on-error, bukáskor egy második próba fut ugyanarra az
      # artifactra. Ha a második is bukik, a job elhasal → hiba-email.
      - name: Pages deploy
        id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Pages deploy (retry — tranziens beragadásra)
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Hiba-email (ha a futás elhasalt)
        # failure() ÉS cancelled(): a job-szintű timeout CANCELLED-del öl (nem failure), így
        # a puszta failure() a beragadt futást NÉMÁVÁ tette (2026-08-24). A cancelled()-ág a
        # végső védőháló, ha a step-timeout (fent) valamiért nem buktatná előbb a lépést.
        if: failure() || cancelled()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: node src/email.js --failure "A mai monitor-futás hibával leállt. Részletek az Actions logban."
