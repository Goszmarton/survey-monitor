name: daily-monitor

on:
  schedule:
    # BACKUP-slot. Az ELSŐDLEGES napi indító a SZERVER: curl → workflow_dispatch
    # 15:55 Europe/Budapest-kor (systemd-timer, DST-biztos, pontos — nem függ a scheduled-cron
    # sorállásától; ld. scripts/gh-trigger.sh + docs/UZEMELTETES.md). 2026-09-23: a korábbi 16:30-ról
    # 15:55-re hozva (user), hogy a levél ~16:15-re kimenjen (a lánc: trigger → futás ~14 perc →
    # deploy + tükör-frissítés + küldés ~3-4 perc). Ez a cron csak BACKUP arra az esetre, ha a
    # szerver-trigger nem lő (kiesés/hálózat/PAT). A dupla indítást (ha mindkettő fut) a run.js
    # idempotencia-őre dedupolja (hasCompletedRun) → pontosan egy levél megy ki.
    #
    # 14:00 UTC (2026-10-07): a primary (13:55 UTC) MÖGÉ, DE korán. A GitHub-cron erősen késhet
    # (mért sorállás 3–6,5h); a korábbi 16:00 UTC + ekkora késés ÁTCSÚSZOTT 22:00 UTC (= éjfél CEST)
    # után → a budapesti runId a KÖVETKEZŐ napra esett, az őr nem no-opolt, hanem ÉJSZAKAI teljes
    # futást csinált (2026-10-06 incidens: a jelentés 00:40 CEST-kor ment, a nappali hírek kimaradtak,
    # a 15:55-ös trigger no-opolt). 14:00 UTC + a legnagyobb mért késés is < 22:00 UTC → nincs
    # átcsúszás. A primary után van, a concurrency-group amúgy is sorosít → ha a primary még megy, a
    # backup bevárja és no-opol. (DST: fix UTC-cron nem tud egész évben azonos helyit; a szerver-timer
    # viszont DST-biztos helyi idő. A korábbi 16:00/14:33/08:43 UTC ELÉVÜLT — ld. git-történet.)
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Őr átlépése (kézi 'küldj most' — akkor is fusson, ha ma már volt sikeres futás)"
        type: boolean
        default: false

permissions:
  contents: write   # állapot-DB visszacommit (F1-től)
  pages: write      # Pages deploy
  id-token: write   # Pages deploy

concurrency:
  group: daily-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24   # beépített node:sqlite flag nélkül, warning nélkül
          cache: npm

      - run: npm ci

      # (a) test-gate: a config-blocklist guard (config_llm.test.js — deprecated groq-modell
      # tiltása) csak akkor VÉD élesben, ha a CI a napi futás ELŐTT lefuttatja. Enélkül egy
      # leállt modell (mint a 08-16-i llama-deprecation) semmit sem bukna deploy előtt. Bukó
      # teszt itt megállítja a jobot, MIELŐTT hibás konfiggal levelet küldene.
      - name: Test-gate (config-blocklist + regresszió)
        run: npm test

      - name: Napi futás (jelentés + levél-előkészítés)
        # A LÉPÉS saját timeoutja kisebb a job-énál (30) — így egy beragadt fetch a LÉPÉST
        # buktatja (failure()), tartalékkal a hiba-email lefutására, a job-szintű cancel
        # ELŐTT. (2026-08-24: egy időtlen body-stream 30 percig némán függött, a job-cancel
        # skippelt MINDENT, a failure()-höz kötött hiba-email is elmaradt.) Az egy-hívásos
        # body-timeout már a http.js-ben ül; ez a step-timeout a második védővonal.
        # 2026-09-23: a run.js már csak ELŐKÉSZÍTI a levelet (outbox/), a KÜLDÉS a deploy utáni
        # lépésbe került (tükör-frissítés után) → SMTP itt már nem kell.
        timeout-minutes: 25
        env:
          # FORCE_RUN=1 átlépi az idempotencia-őrt (run.js): kézi dispatch force=true esetén a
          # futás akkor is lefut, ha ma már volt sikeres. Scheduled/backup futásnál az input
          # nincs → üres → az őr él (dedup). A '' → nem "1", tehát az őr NEM lép át.
          FORCE_RUN: ${{ github.event.inputs.force == 'true' && '1' || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node src/run.js

      - name: Állapot-DB + archív visszacommit (main)
        run: |
          git config user.name "monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          # F4-B: az archive/ a dátumozott jelentések PERZISZTENS forrása (a dist/ gitignore-olt
          # build-kimenet). Visszacommitoljuk, hogy a következő futás buildDist-je a TELJES
          # archívot dist/-be rakhassa → a korábbi napok archív URL-jei nem 404-elnek.
          git add state/monitor.db archive/
          if git diff --cached --quiet; then
            echo "Nincs állapotváltozás — nincs mit commitolni."
          else
            git commit -m "state: napi futás $(date -u +%F)"
            git push
          fi

      # 2026-11-25: v3 → v5. A `upload-pages-artifact@v3` a LESZÁLLÍTOTT `upload-artifact@v3`
      # artifact-backendet használta → a deploy-pages "No artifacts named github-pages were found"
      # hibával bukott (2026-11-24 incidens). A v5 az új backendet használja + Node 24 (nincs
      # Node 20 deprecation-warn sem).
      - name: Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # F4-C: a deploy-pages TRANZIENS Pages-backend beragadásra natív 1-retry. 2026-11-25 ÓTA
      # NON-FATAL: a github.io a MÁSODLAGOS csatorna (a napihir-tükör az ELSŐDLEGES + a levél
      # link-célja). Egy Pages-deploy bukás TÖBBÉ NEM állítja meg a napi levelet (az a napihirre megy,
      # a deploytól függetlenül) és NEM küld téves "jelentés nem készült el" hiba-emailt. A 2026-11-24
      # incidens: a deploy-bukás megbuktatta a jobot → a "Levél küldése" lépés kimaradt → aznap nem
      # ment levél. Mindkét deploy-kísérlet continue-on-error; ha mindkettő bukik, csak figyelmeztetünk.
      - name: Pages deploy
        id: deploy1
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Pages deploy (retry — tranziens beragadásra)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Pages-deploy állapot (NON-FATAL figyelmeztetés)
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: |
          echo "::warning title=Pages deploy::A github.io Pages-deploy MINDKÉT kísérlete bukott. A napi LEVÉL és a napihir-tükör ettől FÜGGETLEN (a levél link-célja a napihir), a github.io egy napot késhet, a következő futás helyreállítja. Nem fail (a levél kimegy)."

      # 2026-09-23: a levél a Pages-deploy + tükör-frissítés UTÁN megy ki (nem a run.js-ben), hogy a
      # linkre (napihir tükör) kattintva a MAI jelentés jöjjön. A send-email.mjs opcionálisan
      # megpiszkálja a szerver tükör-újraépítését (MIRROR_REBUILD_HOOK), megvárja a tükör frissülését
      # (fail-open: türelmi idő után is küld — a napi levél sosem maradhat el), majd küld + a valós
      # státuszt a DB-be írja. A run.js már outbox/-ba készítette a tárgyat/törzset.
      - name: Levél küldése (tükör-frissítés után)
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # Opcionális: védett szerver-végpont a tükör azonnali újraépítéséhez (a 30 perces sweep
          # helyett). Ha nincs beállítva, a send-email a rendes sweepre vár (fail-openig).
          MIRROR_REBUILD_HOOK: ${{ secrets.MIRROR_REBUILD_HOOK }}
        run: node scripts/send-email.mjs

      - name: Levél-státusz visszacommit (main)
        # A send-email.mjs a küldés után a VALÓS email_status-t írta a DB-be (a run.js "prepared"-öt
        # commitolt). Ezt visszacommitoljuk, hogy a reggeli rutin / audit a valós állapotot lássa.
        # A concurrency-group (daily-monitor) sorosít, más nem push-ol közben → fast-forward.
        run: |
          git config user.name "monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/monitor.db
          if git diff --cached --quiet; then
            echo "Nincs email_status-változás — nincs mit commitolni."
          else
            git commit -m "state: levél-státusz $(date -u +%F)"
            git push
          fi

      - name: Hiba-email (ha a futás elhasalt)
        # failure() ÉS cancelled(): a job-szintű timeout CANCELLED-del öl (nem failure), így
        # a puszta failure() a beragadt futást NÉMÁVÁ tette (2026-08-24). A cancelled()-ág a
        # végső védőháló, ha a step-timeout (fent) valamiért nem buktatná előbb a lépést.
        if: failure() || cancelled()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: node src/email.js --failure "A mai monitor-futás hibával leállt. Részletek az Actions logban."
