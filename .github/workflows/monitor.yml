name: daily-monitor

on:
  schedule:
    # 08:43 UTC = 10:43 nyáron (CEST) / 09:43 télen (CET), Europe/Budapest.
    # A "ferde" perc (43) szándékos: a kerek órák zsúfoltak az Actions sorában.
    #
    # Cél-SLA: az email a postaládában 15:00 (Budapest) ELŐTT. A szűkebb korlát
    # a NYÁR: 15:00 CEST = 13:00 UTC (télen 15:00 CET = 14:00 UTC, bővebb), ezért
    # a nyári korlátra méretezünk. A késleltetés domináns tagja a GitHub Actions
    # ütemező sorállása (a futás maga ~2 perc). Mért sorállás-sáv: 112–218 perc;
    # a MÉRT MAXIMUMRA tervezünk, nem a kedvező végre:
    #   08:43 UTC + 218 perc = 12:21 UTC = 14:21 CEST → ~40 perc tartalék 15:00-ig.
    #   (A 2026-08-08-i 112 perc a kedvező vég; télen a 218 is csak 13:21 CET.)
    # Korábban 00:43 UTC / 7:00-s SLA volt; az SLA-t 15:00-ra toltuk, a cron 08:43-ra.
    # Lásd ARCHITEKTURA.md 3.
    - cron: "43 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # állapot-DB visszacommit (F1-től)
  pages: write      # Pages deploy
  id-token: write   # Pages deploy

concurrency:
  group: daily-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24   # beépített node:sqlite flag nélkül, warning nélkül
          cache: npm

      - run: npm ci

      - name: Napi futás (jelentés + email)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: node src/run.js

      - name: Állapot-DB + archív visszacommit (main)
        run: |
          git config user.name "monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          # F4-B: az archive/ a dátumozott jelentések PERZISZTENS forrása (a dist/ gitignore-olt
          # build-kimenet). Visszacommitoljuk, hogy a következő futás buildDist-je a TELJES
          # archívot dist/-be rakhassa → a korábbi napok archív URL-jei nem 404-elnek.
          git add state/monitor.db archive/
          if git diff --cached --quiet; then
            echo "Nincs állapotváltozás — nincs mit commitolni."
          else
            git commit -m "state: napi futás $(date -u +%F)"
            git push
          fi

      - name: Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Pages deploy
        uses: actions/deploy-pages@v4

      - name: Hiba-email (ha a futás elhasalt)
        if: failure()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: node src/email.js --failure "A mai monitor-futás hibával leállt. Részletek az Actions logban."
